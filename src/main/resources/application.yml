spring:
  application:
    name: java-spring-ai-document-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/legalrag}
    username: ${DATABASE_USERNAME:legalrag}
    password: ${DATABASE_PASSWORD:legalrag}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    provider: mock
    prompt-version: legal-draft-v1
  retrieval:
    default-top-k: 3
    max-top-k: 10
